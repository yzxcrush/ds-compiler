name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 使用 GitHub 托管 runner 自带的 Android SDK（含 platform 34 / build-tools）
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Run compiler kernel tests
        run: node tests/node_test.js

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ds-compiler-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Ds Compiler v0.1.${{ github.run_number }}
          body: |
            自动构建的 Ds Compiler Android APK（debug 签名，可直接安装）。
            支持 Ds v0.1 编译器核心子集：函数/数组/映射/控制流/管道等。
本版增强编译器严格性：返回类型/参数类型/`let` 标注/缺失返回/条件/重复定义等在运行前拒绝。
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
